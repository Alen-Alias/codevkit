    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CodevKit",
      "description": "A free, privacy-first online developer toolkit — JSON formatter, Base64 encoder, hash generator, JWT decoder, and more, all running client-side in your browser.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is CodevKit free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, CodevKit is completely free. There's no premium tier, no paywalled tools, and no usage limits — every tool in the toolkit is free to use as much as you want."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to sign up to use CodevKit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. CodevKit has no accounts, no login, and no sign-up form. Open any tool and start using it immediately — your favorites, recent tools, and settings are saved locally in your browser instead of tied to an account."
          }
        },
        {
          "@type": "Question",
          "name": "Is CodevKit safe to use with sensitive data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CodevKit runs entirely client-side, meaning anything you paste or type — API keys, tokens, JSON payloads — stays on your device and is never sent to a server. You can verify this yourself by checking your browser's network tab while using any tool."
          }
        },
        {
          "@type": "Question",
          "name": "Does CodevKit work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, once loaded, CodevKit's tools run fully in your browser without needing an internet connection for the actual processing — no data is round-tripped to a server to format JSON, decode a JWT, or generate a hash."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use CodevKit on my phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CodevKit is fully responsive and works on phones, tablets, and desktops alike, so you can format JSON or decode a token from your phone just as easily as from a laptop."
          }
        },
        {
          "@type": "Question",
          "name": "What is a JSON formatter used for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A JSON formatter takes minified or messy JSON and makes it readable by adding proper indentation and line breaks. It's also used to validate JSON syntax and catch errors like missing commas or unclosed brackets before you use the data in your code."
          }
        },
        {
          "@type": "Question",
          "name": "How do I decode a JWT online?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Paste your JSON Web Token into CodevKit's JWT decoder, and it instantly breaks the token down into its header, payload, and signature sections, showing you the claims and expiration time without needing to write any code."
          }
        },
        {
          "@type": "Question",
          "name": "Is Base64 encoding secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No — Base64 is an encoding scheme, not encryption. It makes binary data safe to transmit as text, but anyone can decode it just as easily as it was encoded. Don't rely on Base64 alone to protect sensitive information."
          }
        },
        {
          "@type": "Question",
          "name": "How do I generate a UUID online?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open CodevKit's UUID generator and a new unique identifier is created instantly — no setup required. You can generate multiple UUIDs at once and copy them directly into your code or database."
          }
        },
        {
          "@type": "Question",
          "name": "Does CodevKit store or save my data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Only what you explicitly want kept, like favorites, recent tools, or settings — and even that stays in your browser's local storage, never on a server. Anything you type into a tool itself, like JSON input or text you're hashing, is never saved or transmitted anywhere."
          }
        },
        {
          "@type": "Question",
          "name": "How do I use the CodevKit command palette?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Press Ctrl+K (or Cmd+K on Mac) from anywhere in CodevKit to open the command palette. From there you can search for any tool, jump to settings, or switch themes without touching the sidebar or a mouse."
          }
        }
      ]
    }
    </script>
